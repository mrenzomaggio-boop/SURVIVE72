name: iOS build

# Manual trigger and every pull request to main. Pushes alone do not run it,
# so each change is built once (macOS minutes are expensive on private repos).
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test SURVIVE72 (iOS Simulator, unsigned)
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          # Newest available iOS runtime, first iPhone on it. Avoids hard-coding
          # a device name that may not exist on the runner image.
          UDID="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | {v: (.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber), (.min|tonumber)]),
                 d: [.value[] | select(.name | startswith("iPhone"))]}
              | select(.d | length > 0)]
            | sort_by(.v) | last | .d[0].udid')"
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests on iphonesimulator (no code signing)
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          XCODEBUILD_CMD="xcodebuild test \
            -project SURVIVE72.xcodeproj \
            -scheme SURVIVE72 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''"
          echo "$XCODEBUILD_CMD" | tr -s ' ' > "$RUNNER_TEMP/xcodebuild_cmd.txt"
          eval "$XCODEBUILD_CMD"

      - name: Report xcodebuild command
        if: always()
        run: |
          CMD="$(cat "$RUNNER_TEMP/xcodebuild_cmd.txt" 2>/dev/null || echo 'not executed')"
          echo "xcodebuild command executed (from ios/):"
          echo "$CMD"
          {
            echo "### xcodebuild command executed"
            echo
            echo "Working directory: \`ios/\`"
            echo
            echo '```sh'
            echo "$CMD"
            echo '```'
            echo
            echo "Result: **${{ steps.build.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"
